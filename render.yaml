# Render.yaml defining backend and frontend services for Render.com
services:
  - type: web
    name: crypto-tracker-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start

  - type: static
    name: crypto-tracker-frontend
    env: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    publishPath: frontend/build

# Note: Add any environment variables (e.g., MONGO_URI, FIREBASE credentials)
# in the Render dashboard for the backend service.