# Render.yaml defining backend and frontend services for Render.com
services:
  - type: web
    name: crypto-tracker
    env: node
    plan: free
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build && npm --prefix backend install
    startCommand: npm --prefix backend start

# Note: Add any environment variables (e.g., MONGO_URI, FIREBASE credentials)
# in the Render dashboard for the backend service.